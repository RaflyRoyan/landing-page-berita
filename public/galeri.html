<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galeri Kegiatan — Warta</title>
  <meta name="description" content="Foto-foto kegiatan warga.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/">Warta<span>.</span></a>
      <button class="nav-toggle" aria-label="Buka menu" aria-expanded="false" aria-controls="nav">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <nav class="nav" id="nav">
        <a href="/">Beranda</a>
        <a href="/#tentang">Tentang</a>
        <a href="/berita.html">Berita</a>
        <a href="/galeri.html" class="active">Galeri</a>
        <a href="/informasi.html">Informasi</a>
        <a href="/#kontak">Kontak</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <!-- Daftar album (galeri.html) -->
      <div id="album-list-view">
        <div class="section-head">
          <div>
            <span class="eyebrow">Galeri</span>
            <h1>Galeri kegiatan</h1>
          </div>
        </div>
        <div class="news-grid" id="album-list">
          <p class="loading">Memuat galeri...</p>
        </div>
      </div>

      <!-- Satu album (galeri.html?id=...) -->
      <div id="album-view" hidden>
        <a class="back-link" href="/galeri.html">← Kembali ke galeri</a>
        <div id="album-detail">
          <p class="loading">Memuat album...</p>
        </div>
      </div>
    </div>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto kegiatan" hidden>
    <button class="lightbox-btn lightbox-close" type="button" data-lb="close" aria-label="Tutup">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <button class="lightbox-btn lightbox-prev" type="button" data-lb="prev" aria-label="Foto sebelumnya">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <img class="lightbox-img" id="lightbox-img" alt="" referrerpolicy="no-referrer">
    <button class="lightbox-btn lightbox-next" type="button" data-lb="next" aria-label="Foto berikutnya">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
    <p class="lightbox-counter" id="lightbox-counter" aria-live="polite"></p>
  </div>

  <footer class="site-footer">
    <div class="container">
      <span>© <span data-year></span> Warta. Semua hak dilindungi.</span>
      <a href="/admin/login.html">Admin</a>
    </div>
  </footer>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/galeri.js"></script>
</body>
</html>
