<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Reservasi — Warta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="admin-body" data-page="reservasi" data-title="Reservasi Kunjungan">
  <aside id="admin-sidebar"></aside>

  <div class="admin-main">
    <header id="admin-topbar"></header>

    <main class="admin-content">
      <div class="alert" id="reservasi-alert" role="status" hidden></div>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>Reservasi Kunjungan</h2>
            <p class="muted panel-sub" id="reservasi-count"></p>
          </div>
          <a class="btn btn-sm btn-ghost" href="/reservasi.html" target="_blank" rel="noopener"><span data-icon="external"></span>Halaman reservasi</a>
        </div>

        <form class="toolbar" id="reservasi-filter" role="search">
          <label for="filter-q" class="sr-only">Cari reservasi</label>
          <input class="input" type="search" id="filter-q" placeholder="Cari kode, organisasi, atau PIC..." autocomplete="off">
          <label for="filter-status" class="sr-only">Status</label>
          <select class="input" id="filter-status">
            <option value="">Semua status</option>
            <option value="menunggu">Menunggu</option>
            <option value="disetujui">Disetujui</option>
            <option value="ditolak">Ditolak</option>
          </select>
          <label for="filter-waktu" class="sr-only">Waktu</label>
          <select class="input" id="filter-waktu">
            <option value="datang">Akan datang</option>
            <option value="lewat">Sudah lewat</option>
            <option value="">Semua waktu</option>
          </select>
        </form>

        <div class="table-wrap">
          <table class="table" id="reservasi-table">
            <thead>
              <tr>
                <th>Jadwal</th>
                <th>Rombongan</th>
                <th>Status</th>
                <th><span class="sr-only">Aksi</span></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/admin-layout.js"></script>
  <script src="/assets/js/reservasi-kalender.js"></script>
  <script src="/assets/js/admin-reservasi.js"></script>
</body>
</html>
