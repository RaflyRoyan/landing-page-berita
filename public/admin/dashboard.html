<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard — Warta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="admin-body" data-page="dashboard" data-title="Dashboard">
  <aside id="admin-sidebar"></aside>

  <div class="admin-main">
    <header id="admin-topbar"></header>

    <main class="admin-content">
      <div class="alert" id="dashboard-alert" role="status" hidden></div>

      <div class="stat-grid">
        <div class="stat-card">
          <span class="stat-icon"><span data-icon="berita"></span></span>
          <div>
            <div class="stat-label">Total berita</div>
            <div class="stat-value" data-stat="total">–</div>
          </div>
        </div>
        <div class="stat-card">
          <span class="stat-icon stat-icon-success"><span data-icon="check"></span></span>
          <div>
            <div class="stat-label">Publish</div>
            <div class="stat-value" data-stat="publish">–</div>
          </div>
        </div>
        <div class="stat-card">
          <span class="stat-icon stat-icon-warning"><span data-icon="draft"></span></span>
          <div>
            <div class="stat-label">Draft</div>
            <div class="stat-value" data-stat="draft">–</div>
          </div>
        </div>
        <div class="stat-card">
          <span class="stat-icon stat-icon-accent"><span data-icon="kategori"></span></span>
          <div>
            <div class="stat-label">Kategori</div>
            <div class="stat-value" data-stat="kategori">–</div>
          </div>
        </div>
        <a class="stat-card stat-link" href="/admin/pesan.html?status=baru">
          <span class="stat-icon stat-icon-danger"><span data-icon="mail"></span></span>
          <div>
            <div class="stat-label">Pesan baru</div>
            <div class="stat-value" data-stat="pesan">–</div>
          </div>
        </a>
      </div>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>Berita terbaru</h2>
            <p class="muted panel-sub">5 berita yang terakhir dibuat.</p>
          </div>
          <a class="btn btn-sm" href="/admin/berita-form.html"><span data-icon="plus"></span>Tambah Berita</a>
        </div>
        <div class="table-wrap">
          <table class="table" id="recent-table">
            <thead>
              <tr>
                <th class="hide-sm"><span class="sr-only">Foto</span></th>
                <th>Judul</th>
                <th>Status</th>
                <th class="hide-sm">Tanggal</th>
                <th><span class="sr-only">Aksi</span></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="panel-foot">
          <a class="link-more" href="/admin/berita.html">Lihat semua berita <span data-icon="arrow"></span></a>
        </div>
      </section>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/admin-layout.js"></script>
  <script src="/assets/js/admin-dashboard.js"></script>
</body>
</html>
