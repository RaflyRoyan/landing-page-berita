<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard — Warta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/admin/dashboard.html">Warta<span>.</span> <small class="muted" style="font-family: var(--font-body); font-size: 0.8rem; font-weight: 500;">Admin</small></a>
      <div style="display: flex; align-items: center; gap: 12px;">
        <span class="muted" id="user-name" style="font-size: 0.9rem;"></span>
        <a class="btn btn-ghost btn-sm" href="/" target="_blank" rel="noopener">Lihat situs</a>
        <button class="btn btn-ghost btn-sm" id="logout-btn" type="button">Logout</button>
      </div>
    </div>
  </header>

  <main class="container admin-layout">
    <section class="panel">
      <div class="panel-head">
        <h2>Daftar Berita</h2>
      </div>
      <div class="alert" id="list-alert" role="status" hidden></div>
      <div class="table-wrap">
        <table class="table" id="berita-table">
          <thead>
            <tr>
              <th>Foto</th>
              <th>Judul</th>
              <th>Status</th>
              <th>Tanggal</th>
              <th><span class="sr-only">Aksi</span></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="panel panel-form">
      <div class="panel-head">
        <h2 id="form-title">Tambah Berita</h2>
      </div>
      <div class="alert alert-error" id="form-alert" role="alert" hidden></div>

      <form id="berita-form">
        <input type="hidden" name="id">
        <input type="hidden" name="foto_id">

        <div class="field">
          <label for="judul">Judul</label>
          <input id="judul" name="judul" type="text" required maxlength="200">
        </div>

        <div class="field">
          <label for="ringkasan">Ringkasan</label>
          <textarea id="ringkasan" name="ringkasan" rows="2" style="min-height: 70px;" maxlength="300"></textarea>
        </div>

        <div class="field">
          <label for="isi">Isi</label>
          <textarea id="isi" name="isi" rows="8" placeholder="Pisahkan paragraf dengan baris kosong."></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="kategori">Kategori</label>
            <input id="kategori" name="kategori" type="text" list="kategori-list">
            <datalist id="kategori-list">
              <option value="Pengumuman">
              <option value="Kegiatan">
              <option value="Informasi">
            </datalist>
          </div>
          <div class="field">
            <label for="status">Status</label>
            <select id="status" name="status">
              <option value="draft">Draft</option>
              <option value="publish">Publish</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="foto">Foto</label>
          <input id="foto" type="file" accept="image/*">
          <small class="muted">Gambar dikompres otomatis (maks. lebar 1600px, JPEG).</small>
          <img id="foto-preview" class="photo-preview" alt="Pratinjau foto" hidden>
        </div>

        <div class="form-actions">
          <button class="btn" type="submit" id="submit-btn">Simpan</button>
          <button class="btn btn-ghost" type="button" id="cancel-btn" hidden>Batal</button>
        </div>
      </form>
    </section>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/admin.js"></script>
</body>
</html>
